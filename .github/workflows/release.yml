# Release exactly one module using <module id>/v<module.json version>.
# A version with a suffix, such as <module id>/v0.2.0-beta.1, is a pre-release.
name: release

on:
  push:
    tags: ['*/v*']

permissions: {}

jobs:
  release:
    uses: voxta-ai/voxta-module-actions/.github/workflows/release.yml@v1
    permissions:
      contents: write
      id-token: write
      attestations: write
    with:
      # Voxta's own module source, for a repository Voxta trusts.
      publish: ${{ vars.VOXTA_PUBLISH == 'true' }}
      api-url: ${{ vars.VOXTA_API_URL || 'https://api.voxta.ai' }}
